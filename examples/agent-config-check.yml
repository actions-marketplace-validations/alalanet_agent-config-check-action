# .github/workflows/agent-config-check.yml — check the agent configuration of every pull request.
# pull_request, never pull_request_target: the Action reads files of the checkout and runs nothing from the pull
# request, so it needs no secret and no write token, and a fork's pull request is checked the same way.
name: agent config check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Optional: lets the repository's own runs present a GitHub OIDC token (audience https://alalanet.com), so the
      # check counts against this repository's daily quota instead of the runner address's, which GitHub's runners
      # share. Forks' pull requests get no token and use the address quota. Remove the line to send no token.
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: alalanet/agent-config-check-action@v1
        # with:
        #   fail-on: block     # or hold
        #   on-error: fail     # or warn
        #   github-oidc: auto  # or off
